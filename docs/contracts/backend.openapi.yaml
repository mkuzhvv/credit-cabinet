                  sequence: 2
                  role: ASSISTANT
                  text: Для покупки печи на несколько лет подойдёт кредит на длительный срок. Ознакомьтесь с его условиями.
                  recommendedProductCode: LONG_TERM
                  replyToMessageId: 2ba1c7a6-c071-4698-bce2-5925d6fde109
                  createdAt: '2026-10-22T10:00:03Z'
        '400':
