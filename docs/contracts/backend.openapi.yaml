openapi: 3.1.1
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: Credit Cabinet — Backend API
  version: 0.5.0
  description: 'Контракт Java для фронта: пять демонстрационных продуктов, полная форма с cashBalance,
    фиксированные calculationDate/reportingPeriod. cashBalance — свободные собственные деньги до нового кредита;
    null допустим в черновике, неизвестное значение не заменяется нулём. Cookie/CSRF.
    Формальная проверка Python схемы 4. Реальная выдача не реализуется; условия демонстрационные.'
servers:
- url: /api/v1
  description: Один origin через frontend proxy / общий reverse proxy.
tags:
- name: Session
- name: Products
- name: Applications
- name: Processing
- name: Assistant
security:
- SessionCookie: []
paths:
  /csrf:
    get:
      operationId: getCsrfToken
      tags:
      - Session
      summary: Получить CSRF-токен
      security: []
      description: Разрешено без входа. Создаёт анонимную сессию при необходимости; пользователь ещё не аутентифицирован.
        Повторить после успешного демовхода, поскольку старый CSRF-токен сбрасывается.
      responses:
        '200':
          description: Токен текущей, в том числе анонимной, сессии.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Set-Cookie:
              $ref: '#/components/headers/SetCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfView'
              example:
                token: example-csrf-token
                headerName: X-CSRF-TOKEN
        '500':
          $ref: '#/components/responses/InternalError'
  /demo/session:
    post:
      operationId: initializeDemoSession
      tags:
      - Session
      summary: Автоматически войти в демоаккаунт
      security:
      - SessionCookie: []
        CsrfToken: []
      description: 'Только demo-профиль. Разрешено анонимной сессии, созданной GET /csrf; нужны её cookie и CSRF-токен.
        Без тела: аккаунт и компания выбираются сервером. При первом входе ID сессии меняется. Повтор действующей сессии
        не меняет пользователя. После успеха вызвать GET /csrf. Вне demo-профиля — 404.'
      responses:
        '200':
          description: Сессия создана или уже существует.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Set-Cookie:
              $ref: '#/components/headers/SetCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserView'
              example:
                user:
                  id: b827db91-df42-4d75-b5e0-8f0a7a512ee1
                  displayName: Демо-представитель
                company:
                  id: 97daa92f-127c-4f70-8a0c-0711f13c62ef
                  name: Демо-пекарня
                  legalForm: OOO
                  registrationDate: '2019-08-01'
                  countryCode: RU
                  hasSettlementAccount: true
                  hasRegularInflowLast3Months: true
                demo: true
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /me:
    get:
      operationId: getCurrentUser
      tags:
      - Session
      summary: Получить пользователя и компанию
      responses:
        '200':
          description: Текущий контекст.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserView'
              example:
                user:
                  id: b827db91-df42-4d75-b5e0-8f0a7a512ee1
                  displayName: Демо-представитель
                company:
                  id: 97daa92f-127c-4f70-8a0c-0711f13c62ef
                  name: Демо-пекарня
                  legalForm: OOO
                  registrationDate: '2019-08-01'
                  countryCode: RU
                  hasSettlementAccount: true
                  hasRegularInflowLast3Months: true
                demo: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /products:
    get:
      operationId: listProducts
      tags:
      - Products
      summary: Получить действующий каталог
      responses:
        '200':
          description: Каталог MVP; числа примера иллюстративны.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductList'
              example:
                items:
                - code: WORKING_CAPITAL
                  name: Оборотный кредит
                  description: Одна сумма на закупки товаров, сырья и текущие расходы бизнеса.
                  terms:
                    version: demo-working-capital-2
                    currency: RUB
                    minAmount: '100000.00'
                    maxAmount: '3000000.00'
                    minTermMonths: 3
                    maxTermMonths: 12
                    annualRatePercent: '24.00'
                    minBusinessAgeMonths: 6
                    financialPeriodMonths: 6
                    financingType: TERM_LOAN
                    repaymentType: ANNUITY
                    requiresSettlementAccount: false
                    requiresRegularInflow: false
                    overdraftRules: null
                    revolvingLineRules: null
                    governmentContractRules: null
                    disbursementDescription: Вся сумма одной выплатой.
                    repaymentDescription: Ежемесячно равными платежами; проценты начисляются на остаток долга.
                    generalConditions: Учебный проект. Условия демонстрационные. RUB для ИП и ООО, зарегистрированных
                      в России. Залог и поручительство не требуются. Комиссий за выдачу и обслуживание нет; обязательная
                      страховка отсутствует. Досрочное погашение без комиссии, проценты за фактическое время использования
                      денег. Отсутствие текущей просрочки обязательно; соблюдение требований не гарантирует одобрение.
                - code: OVERDRAFT
                  name: Овердрафт
                  description: Лимит к расчётному счёту для временного недостатка средств до ближайших поступлений.
                  terms:
                    version: demo-overdraft-2
                    currency: RUB
                    minAmount: '50000.00'
                    maxAmount: '1000000.00'
                    minTermMonths: 12
                    maxTermMonths: 12
                    annualRatePercent: '26.00'
                    minBusinessAgeMonths: 6
                    financialPeriodMonths: 3
                    financingType: OVERDRAFT
                    repaymentType: ACCOUNT_SWEEP
                    requiresSettlementAccount: true
                    requiresRegularInflow: true
                    overdraftRules:
                      maxInflowSharePercent: '30.00'
                      maxDebtPeriodDays: 30
                    revolvingLineRules: null
                    governmentContractRules: null
                    disbursementDescription: Использование лимита при недостатке собственных средств на расчётном счёте.
                    repaymentDescription: Автоматически из поступлений; задолженность полностью погашается за 30 дней
                      с первого использования, новые расходы срок не продлевают. Проценты ежемесячно. После полного погашения
                      лимит снова доступен.
                    generalConditions: Учебный проект. Условия демонстрационные. RUB для ИП и ООО, зарегистрированных
                      в России. Залог и поручительство не требуются. Комиссий за выдачу и обслуживание нет; обязательная
                      страховка отсутствует. Досрочное погашение без комиссии, проценты за фактическое время использования
                      денег. Отсутствие текущей просрочки обязательно; соблюдение требований не гарантирует одобрение.
                - code: REVOLVING_LINE
                  name: Возобновляемая кредитная линия
                  description: Общий лимит для регулярных закупок; деньги получают частями, погашенный основной долг
                    восстанавливает доступный лимит.
                  terms:
                    version: demo-revolving-line-2
                    currency: RUB
                    minAmount: '300000.00'
                    maxAmount: '5000000.00'
                    minTermMonths: 24
                    maxTermMonths: 24
                    annualRatePercent: '23.00'
                    minBusinessAgeMonths: 12
                    financialPeriodMonths: 6
                    financingType: REVOLVING_LINE
                    repaymentType: EQUAL_PRINCIPAL_PER_TRANCHE
                    requiresSettlementAccount: false
                    requiresRegularInflow: false
                    overdraftRules: null
                    revolvingLineRules:
                      minTrancheTermMonths: 3
                      maxTrancheTermMonths: 6
                    governmentContractRules: null
                    disbursementDescription: Траншами в пределах возобновляемого лимита; неиспользованный лимит бесплатный.
                    repaymentDescription: По каждому траншу ежемесячно равные доли основного долга плюс проценты на остаток.
                      Срок транша 3–6 месяцев, возврат не позднее окончания линии.
                    generalConditions: Учебный проект. Условия демонстрационные. RUB для ИП и ООО, зарегистрированных
                      в России. Залог и поручительство не требуются. Комиссий за выдачу и обслуживание нет; обязательная
                      страховка отсутствует. Досрочное погашение без комиссии, проценты за фактическое время использования
                      денег. Отсутствие текущей просрочки обязательно; соблюдение требований не гарантирует одобрение.
                - code: LONG_TERM
                  name: Кредит на длительный срок
                  description: Одна сумма на оборудование, ремонт помещения или расширение бизнеса.
                  terms:
                    version: demo-long-term-2
                    currency: RUB
                    minAmount: '500000.00'
                    maxAmount: '5000000.00'
                    minTermMonths: 24
                    maxTermMonths: 60
                    annualRatePercent: '22.00'
                    minBusinessAgeMonths: 12
                    financialPeriodMonths: 12
                    financingType: TERM_LOAN
                    repaymentType: ANNUITY
                    requiresSettlementAccount: false
                    requiresRegularInflow: false
                    overdraftRules: null
                    revolvingLineRules: null
                    governmentContractRules: null
                    disbursementDescription: Вся сумма одной выплатой на заявленную цель и бюджет покупки или проекта.
                    repaymentDescription: Ежемесячно равными платежами; проценты начисляются на остаток долга.
                    generalConditions: Учебный проект. Условия демонстрационные. RUB для ИП и ООО, зарегистрированных
                      в России. Залог и поручительство не требуются. Комиссий за выдачу и обслуживание нет; обязательная
                      страховка отсутствует. Досрочное погашение без комиссии, проценты за фактическое время использования
                      денег. Отсутствие текущей просрочки обязательно; соблюдение требований не гарантирует одобрение.
                - code: GOVERNMENT_CONTRACT_LINE
                  name: Кредитная линия на госконтракт
                  description: Невозобновляемая линия на исполнение уже заключённого контракта по 44-ФЗ; не для участия
                    в закупке или обеспечения заявки.
                  terms:
                    version: demo-government-contract-line-2
                    currency: RUB
                    minAmount: '300000.00'
                    maxAmount: '10000000.00'
                    minTermMonths: 1
                    maxTermMonths: 12
                    annualRatePercent: '21.00'
                    minBusinessAgeMonths: 12
                    financialPeriodMonths: 12
                    financingType: NON_REVOLVING_LINE
                    repaymentType: CONTRACT_PROCEEDS
                    requiresSettlementAccount: false
                    requiresRegularInflow: false
                    overdraftRules: null
                    revolvingLineRules: null
                    governmentContractRules:
                      maxNetContractSharePercent: '70.00'
                      maxDaysAfterFinalPayment: 30
                      renewable: false
                    disbursementDescription: Траншами до завершения исполнения контракта. Погашение не восстанавливает
                      выбранный лимит.
                    repaymentDescription: Проценты ежемесячно; поступления по контракту направляются на долг. Остаток
                      возвращается к плановой дате даже при задержке оплаты заказчиком; не позднее 30 дней после окончательной
                      оплаты по контракту.
                    generalConditions: Учебный проект. Условия демонстрационные. RUB для ИП и ООО, зарегистрированных
                      в России. Залог и поручительство не требуются. Комиссий за выдачу и обслуживание нет; обязательная
                      страховка отсутствует. Досрочное погашение без комиссии, проценты за фактическое время использования
                      денег. Отсутствие текущей просрочки обязательно; соблюдение требований не гарантирует одобрение.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /applications:
    post:
      operationId: createApplication
      tags:
      - Applications
      summary: Создать черновик
      security:
      - SessionCookie: []
        CsrfToken: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApplicationRequest'
            example:
              productCode: WORKING_CAPITAL
      description: Связывает черновик с текущей компанией и представителем. Пользователь, компания, ставка и состояние
        не принимаются от фронта. Неизвестный/недоступный продукт — 422. Повтор создания с тем же ключом возвращает исходный
        результат команды; актуальная заявка читается GET-операцией.
      responses:
        '201':
          description: Создан новый DRAFT.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationView'
              example:
                id: 7be0c0bf-9019-47e0-a6b1-67548f1038f2
                version: 0
                status: DRAFT
                product:
                  code: WORKING_CAPITAL
                  name: Оборотный кредит
                  description: Одна сумма на закупки товаров, сырья и текущие расходы бизнеса.
                  terms:
                    version: demo-working-capital-2
                    currency: RUB
                    minAmount: '100000.00'
                    maxAmount: '3000000.00'
                    minTermMonths: 3
                    maxTermMonths: 12
                    annualRatePercent: '24.00'
                    minBusinessAgeMonths: 6
                    financialPeriodMonths: 6
                    financingType: TERM_LOAN
                    repaymentType: ANNUITY
                    requiresSettlementAccount: false
                    requiresRegularInflow: false
                    overdraftRules: null
                    revolvingLineRules: null
                    governmentContractRules: null
                    disbursementDescription: Вся сумма одной выплатой.
                    repaymentDescription: Ежемесячно равными платежами; проценты начисляются на остаток долга.
                    generalConditions: Учебный проект. Условия демонстрационные. RUB для ИП и ООО, зарегистрированных
                      в России. Залог и поручительство не требуются. Комиссий за выдачу и обслуживание нет; обязательная
                      страховка отсутствует. Досрочное погашение без комиссии, проценты за фактическое время использования
                      денег. Отсутствие текущей просрочки обязательно; соблюдение требований не гарантирует одобрение.
                reportingPeriod:
                  startDate: '2026-04-01'
                  endDate: '2026-09-30'
                  months: 6
                form:
                  amount: null
                  termMonths: null
                  averageMonthlyInflow: null
                  averageMonthlyOutflow: null
                  financingPurpose: null
                  projectBudget: null
                  trancheTermMonths: null
                  governmentContract: null
                  cashBalance: null
                assessmentId: null
                lastSubmittedAt: null
                decision: null
                requiredInformation: []
                processingError: null
                allowedActions:
                - UPDATE_FORM
                - SUBMIT
                createdAt: '2026-10-22T10:00:00Z'
                updatedAt: '2026-10-22T10:00:00Z'
                calculationDate: '2026-10-22'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      operationId: listApplications
      tags:
      - Applications
      summary: Получить заявки текущей компании
      parameters:
      - name: page
        in: query
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: size
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: status
        in: query
        schema:
          $ref: '#/components/schemas/ApplicationStatus'
      description: Фильтрация по правам выполняется сервером. Порядок updatedAt DESC, id DESC. Страница за пределами
        списка возвращает items=[].
      responses:
        '200':
          description: Страница заявок.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationPage'
              example:
                items:
                - id: 7be0c0bf-9019-47e0-a6b1-67548f1038f2
                  productCode: WORKING_CAPITAL
                  productName: Оборотный кредит
                  status: DRAFT
                  amount: '500000.00'
                  termMonths: 12
                  version: 1
                  updatedAt: '2026-10-22T10:01:00Z'
                page: 0
                size: 20
                totalElements: 1
                totalPages: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'
  /applications/{applicationId}:
    get:
      operationId: getApplication
      tags:
      - Applications
      summary: Прочитать заявку, состояние и решение
      parameters:
      - $ref: '#/components/parameters/ApplicationId'
      description: Используется для восстановления формы и опроса состояния. В CHECKING опрашивать примерно раз в 2 секунды;
        остановиться при выходе из CHECKING или уходе со страницы. Отсутствующая и чужая заявка дают одинаковый 404.
      responses:
        '200':
          description: Актуальная заявка. DECLINED и TECHNICAL_HOLD также возвращаются с HTTP 200.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationView'
              examples:
                draft:
                  $ref: '#/components/examples/ApplicationDraft'
                checking:
                  $ref: '#/components/examples/ApplicationChecking'
                needs_info:
                  $ref: '#/components/examples/ApplicationNeedsInfo'
                technical_hold:
                  $ref: '#/components/examples/ApplicationTechnicalHold'
                credit_history_unavailable:
                  $ref: '#/components/examples/ApplicationCreditHistoryUnavailable'
                credit_history_timeout:
                  $ref: '#/components/examples/ApplicationCreditHistoryTimeout'
                credit_history_invalid_response:
                  $ref: '#/components/examples/ApplicationCreditHistoryInvalidResponse'
                approved:
                  $ref: '#/components/examples/ApplicationApproved'
                declined:
                  $ref: '#/components/examples/ApplicationDeclined'
                overdraft:
                  $ref: '#/components/examples/ApplicationOverdraft'
                revolving_line:
                  $ref: '#/components/examples/ApplicationRevolvingLine'
                long_term:
                  $ref: '#/components/examples/ApplicationLongTerm'
                government_contract_line:
                  $ref: '#/components/examples/ApplicationGovernmentContractLine'
                current_overdue_debt:
                  $ref: '#/components/examples/ApplicationCurrentOverdueDebt'
                approved_overdraft:
                  $ref: '#/components/examples/ApplicationApprovedOverdraft'
                approved_revolving_line:
                  $ref: '#/components/examples/ApplicationApprovedRevolvingLine'
                approved_long_term:
                  $ref: '#/components/examples/ApplicationApprovedLongTerm'
                approved_government_contract_line:
                  $ref: '#/components/examples/ApplicationApprovedGovernmentContractLine'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /applications/{applicationId}/form:
    put:
      operationId: saveApplicationForm
      tags:
      - Applications
      summary: Заменить содержимое формы
      security:
      - SessionCookie: []
        CsrfToken: []
      parameters:
      - $ref: '#/components/parameters/ApplicationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveFormRequest'
            examples:
              overdraft:
                value:
                  expectedVersion: 0
                  form:
                    amount: '500000.00'
                    termMonths: 12
                    averageMonthlyInflow: '2000000.00'
                    averageMonthlyOutflow: '800000.00'
                    financingPurpose: null
                    projectBudget: null
                    trancheTermMonths: null
                    governmentContract: null
                    cashBalance: '1000000.00'
              revolving_line:
                value:
                  expectedVersion: 0
                  form:
                    amount: '500000.00'
                    termMonths: 24
                    averageMonthlyInflow: '1200000.00'
                    averageMonthlyOutflow: '800000.00'
                    financingPurpose: null
                    projectBudget: null
                    trancheTermMonths: 3
                    governmentContract: null
                    cashBalance: '1000000.00'
              long_term:
                value:
                  expectedVersion: 0
                  form:
                    amount: '500000.00'
                    termMonths: 24
                    averageMonthlyInflow: '1200000.00'
                    averageMonthlyOutflow: '800000.00'
                    financingPurpose: Покупка печи для пекарни
                    projectBudget: '600000.00'
                    trancheTermMonths: null
                    governmentContract: null
                    cashBalance: '1000000.00'
              government_contract_line:
                value:
                  expectedVersion: 0
                  form:
                    amount: '500000.00'
                    termMonths: 6
