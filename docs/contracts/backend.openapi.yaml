                  properties:
                    name:
                      type: string
                      minLength: 1
                      maxLength: 300
                      pattern: '[\s\S]*\S[\s\S]*'
                    purchasePrice:
                      $ref: '#/components/schemas/PositiveMoney'
                  required:
                  - name
                  - purchasePrice
