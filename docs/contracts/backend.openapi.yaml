      description: Только TECHNICAL_HOLD. Новый assessmentId; та же заявка, данные и условия предыдущей попытки. Это
        технический повтор, а не новая подача по новым условиям. Неверное состояние — 409 INVALID_APPLICATION_STATE.
        Тот же ключ возвращает исходное подтверждение команды; параллельная независимая проверка не создаётся.
      responses:
        '202':
