        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '502':
          $ref: '#/components/responses/AssistantInvalidResponse'
        '503':
          $ref: '#/components/responses/AssistantUnavailable'
        '504':
          $ref: '#/components/responses/AssistantTimeout'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: JSESSIONID
      description: HttpOnly session cookie. Swagger UI в браузере использует реальную cookie; её значение не вводится
        в JSON.
    CsrfToken:
      type: apiKey
      in: header
      name: X-CSRF-TOKEN
      description: Получить GET /csrf и обновить после входа. Это защита cookie-запросов, не JWT.
  parameters:
    ApplicationId:
      name: applicationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ConversationId:
      name: conversationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: 'UUID одного действия. Область: пользователь + компания + операция + ресурс. Тот же ключ и тело повторяют
        результат команды; другое тело — 409 IDEMPOTENCY_KEY_REUSED. Повтор распознаётся до проверки expectedVersion.
        Успешные результаты хранятся минимум 24 часа в PostgreSQL, независимо от сессии.'
  headers:
    RequestId:
      description: Идентификатор запроса для диагностики.
      schema:
        type: string
        format: uuid
    NoStore:
      description: Ответ не кэшируется.
      schema:
        type: string
        const: no-store
    SetCookie:
      description: 'При создании или смене сессии: JSESSIONID; HttpOnly; Path=/; SameSite=Lax. Secure включается при
        HTTPS. JavaScript не читает cookie.'
      schema:
        type: string
    Location:
      description: Адрес созданного ресурса или состояния принятой обработки.
      schema:
        type: string
        format: uri-reference
  responses:
    BadRequest:
      description: Неверный формат запроса
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:credit-cabinet:problem:malformed-request
            title: Неверный формат запроса
            status: 400
            code: MALFORMED_REQUEST
            requestId: 291536c3-43fc-4419-a671-44e4cd902f3e
    Unauthorized:
      description: Создайте демосессию
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:credit-cabinet:problem:session-required
            title: Создайте демосессию
            status: 401
            code: SESSION_REQUIRED
            requestId: 291536c3-43fc-4419-a671-44e4cd902f3e
    Forbidden:
      description: Обновите защитный токен запроса
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:credit-cabinet:problem:csrf-invalid
            title: Обновите защитный токен запроса
            status: 403
            code: CSRF_INVALID
            requestId: 291536c3-43fc-4419-a671-44e4cd902f3e
    NotFound:
      description: Ресурс не найден
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:credit-cabinet:problem:not-found
            title: Ресурс не найден
            status: 404
            code: NOT_FOUND
            requestId: 291536c3-43fc-4419-a671-44e4cd902f3e
    Conflict:
      description: Заявка уже изменена
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:credit-cabinet:problem:version-conflict
            title: Заявка уже изменена
            status: 409
            code: VERSION_CONFLICT
            requestId: 291536c3-43fc-4419-a671-44e4cd902f3e
            currentVersion: 2
    ValidationFailed:
      description: Проверьте поля
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:credit-cabinet:problem:validation-failed
            title: Проверьте поля
            status: 422
            code: VALIDATION_FAILED
            requestId: 291536c3-43fc-4419-a671-44e4cd902f3e
            errors:
            - field: form.amount
              code: POSITIVE_REQUIRED
              message: Укажите сумму больше нуля
    InternalError:
      description: Не удалось выполнить запрос
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:credit-cabinet:problem:internal-error
            title: Не удалось выполнить запрос
            status: 500
            code: INTERNAL_ERROR
            requestId: 291536c3-43fc-4419-a671-44e4cd902f3e
    AssistantInvalidResponse:
      description: Помощник вернул некорректный ответ
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:credit-cabinet:problem:assistant-invalid-response
            title: Помощник вернул некорректный ответ
            status: 502
            code: ASSISTANT_INVALID_RESPONSE
            requestId: 291536c3-43fc-4419-a671-44e4cd902f3e
    AssistantUnavailable:
      description: Помощник временно недоступен
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:credit-cabinet:problem:assistant-unavailable
            title: Помощник временно недоступен
            status: 503
            code: ASSISTANT_UNAVAILABLE
            requestId: 291536c3-43fc-4419-a671-44e4cd902f3e
    AssistantTimeout:
      description: Помощник не успел ответить
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:credit-cabinet:problem:assistant-timeout
            title: Помощник не успел ответить
            status: 504
            code: ASSISTANT_TIMEOUT
            requestId: 291536c3-43fc-4419-a671-44e4cd902f3e
  schemas:
    Money:
      type: string
      minLength: 4
      maxLength: 15
      pattern: ^(0|[1-9][0-9]{0,11})\.[0-9]{2}$
      description: Неотрицательная сумма в рублях, ровно две цифры после точки. Java BigDecimal / Python Decimal. Это
        технический диапазон, не лимит продукта.
    PositiveMoney:
      type: string
      minLength: 4
      maxLength: 15
      pattern: ^(0|[1-9][0-9]{0,11})\.[0-9]{2}$
      description: Положительная сумма в RUB, ровно две цифры после точки.
      not:
        const: '0.00'
    ProductCode:
      type: string
      minLength: 2
      maxLength: 64
      pattern: ^[A-Z][A-Z0-9_]{1,63}$
      description: 'Стабильный код из каталога. MVP: WORKING_CAPITAL, OVERDRAFT, REVOLVING_LINE, LONG_TERM, GOVERNMENT_CONTRACT_LINE.
        Список не зашит в enum; новый код требует явной поддержки формы, политики и ML.'
    FieldCode:
      type: string
      minLength: 1
      maxLength: 120
      pattern: ^[a-z][a-zA-Z0-9]*(\.[a-z][a-zA-Z0-9]*)*$
      description: Путь поля, например form.amount или form.financingPurpose.
    Version:
      type: integer
      minimum: 0
      format: int64
      maximum: 9007199254740991
      description: Версия заявки. Меняется при изменении данных или состояния; безопасна для JavaScript Number.
    ReportingPeriod:
      type: object
      additionalProperties: false
      properties:
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        months:
          type: integer
          enum:
          - 3
          - 6
          - 12
      required:
      - startDate
      - endDate
      - months
      description: 'Полные календарные месяцы до месяца calculationDate черновика; границы включительно. Число месяцев
        определяет продукт: OVERDRAFT=3, WORKING_CAPITAL/REVOLVING_LINE=6, LONG_TERM/GOVERNMENT_CONTRACT_LINE=12. Период
        фиксируется сервером и не сдвигается при submit/retry.'
    FieldIssue:
      type: object
      additionalProperties: false
      properties:
        field:
          $ref: '#/components/schemas/FieldCode'
        code:
          type: string
          minLength: 1
          maxLength: 80
          pattern: ^[A-Z][A-Z0-9_]*$
        message:
          type: string
          minLength: 1
          maxLength: 1000
          pattern: '[\s\S]*\S[\s\S]*'
      required:
      - field
      - code
      - message
    Problem:
      type: object
      additionalProperties: true
      required:
      - type
      - title
      - status
      - code
      - requestId
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
          minLength: 1
          maxLength: 200
          pattern: '[\s\S]*\S[\s\S]*'
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
          minLength: 1
          maxLength: 2000
          pattern: '[\s\S]*\S[\s\S]*'
        instance:
          type: string
          format: uri-reference
        code:
          type: string
          minLength: 1
          maxLength: 80
          pattern: ^[A-Z][A-Z0-9_]*$
        requestId:
          type: string
          format: uuid
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldIssue'
          maxItems: 30
        currentVersion:
          $ref: '#/components/schemas/Version'
        currentProductTermsVersion:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '[\s\S]*\S[\s\S]*'
      description: RFC 9457 application/problem+json. code используется программно; message/title — для человека. Неизвестные
        расширения ответа клиент игнорирует. Стек, финансовые данные и секреты сюда не включаются.
    ApplicationStatus:
      type: string
      enum:
      - DRAFT
      - CHECKING
      - NEEDS_INFO
      - TECHNICAL_HOLD
      - APPROVED
      - DECLINED
    AllowedAction:
      type: string
      enum:
      - UPDATE_FORM
      - SUBMIT
      - RETRY
    CsrfView:
      type: object
      additionalProperties: false
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 1024
          pattern: '[\s\S]*\S[\s\S]*'
        headerName:
          type: string
          const: X-CSRF-TOKEN
      required:
      - token
      - headerName
    UserView:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
          minLength: 1
          maxLength: 200
          pattern: '[\s\S]*\S[\s\S]*'
      required:
      - id
      - displayName
    CompanyView:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 300
          pattern: '[\s\S]*\S[\s\S]*'
        legalForm:
          type: string
          enum:
          - IP
          - OOO
        registrationDate:
          type: string
          format: date
        countryCode:
          type: string
          const: RU
        hasSettlementAccount:
          type: boolean
        hasRegularInflowLast3Months:
          type: boolean
      required:
      - id
      - name
      - legalForm
      - registrationDate
      - countryCode
      - hasSettlementAccount
      - hasRegularInflowLast3Months
    CurrentUserView:
      type: object
      additionalProperties: false
      properties:
        user:
          $ref: '#/components/schemas/UserView'
        company:
          $ref: '#/components/schemas/CompanyView'
        demo:
          type: boolean
          const: true
      required:
      - user
      - company
      - demo
    ProductTerms:
      type: object
      additionalProperties: false
      properties:
        version:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '[\s\S]*\S[\s\S]*'
        currency:
          type: string
          const: RUB
        minAmount:
          $ref: '#/components/schemas/PositiveMoney'
        maxAmount:
          $ref: '#/components/schemas/PositiveMoney'
        minTermMonths:
          type: integer
          minimum: 1
          maximum: 600
        maxTermMonths:
          type: integer
          minimum: 1
          maximum: 600
        annualRatePercent:
          type: string
          minLength: 4
          maxLength: 6
          pattern: ^(0|[1-9][0-9]{0,2})\.[0-9]{2}$
        minBusinessAgeMonths:
          type: integer
          minimum: 0
        financialPeriodMonths:
          type: integer
          enum:
          - 3
          - 6
          - 12
        financingType:
          type: string
          enum:
          - TERM_LOAN
          - OVERDRAFT
          - REVOLVING_LINE
          - NON_REVOLVING_LINE
        repaymentType:
          type: string
          enum:
          - ANNUITY
          - ACCOUNT_SWEEP
          - EQUAL_PRINCIPAL_PER_TRANCHE
          - CONTRACT_PROCEEDS
        requiresSettlementAccount:
          type: boolean
        requiresRegularInflow:
          type: boolean
        overdraftRules:
          anyOf:
          - $ref: '#/components/schemas/OverdraftRules'
          - type: 'null'
        revolvingLineRules:
          anyOf:
          - $ref: '#/components/schemas/RevolvingLineRules'
          - type: 'null'
        governmentContractRules:
          anyOf:
          - $ref: '#/components/schemas/GovernmentContractRules'
          - type: 'null'
        disbursementDescription:
          type: string
          minLength: 1
          maxLength: 1000
          pattern: '[\s\S]*\S[\s\S]*'
        repaymentDescription:
          type: string
          minLength: 1
          maxLength: 1000
          pattern: '[\s\S]*\S[\s\S]*'
        generalConditions:
          type: string
          minLength: 1
          maxLength: 3000
          pattern: '[\s\S]*\S[\s\S]*'
      required:
      - version
      - currency
      - minAmount
      - maxAmount
      - minTermMonths
      - maxTermMonths
      - annualRatePercent
      - minBusinessAgeMonths
      - financialPeriodMonths
      - financingType
      - repaymentType
      - requiresSettlementAccount
      - requiresRegularInflow
      - overdraftRules
      - revolvingLineRules
      - governmentContractRules
      - disbursementDescription
      - repaymentDescription
      - generalConditions
      description: Условия демопродукта. amount означает сумму для TERM_LOAN и лимит для линий/овердрафта; termMonths
        — срок кредита либо действия линии/лимита, не срок транша. Все ставки — на фактический остаток долга. Числа каталога
        берутся из кредитной политики.
      allOf:
      - if:
          properties:
            financingType:
              const: TERM_LOAN
          required:
          - financingType
        then:
          properties:
            overdraftRules:
              type: 'null'
            revolvingLineRules:
              type: 'null'
            governmentContractRules:
              type: 'null'
            requiresSettlementAccount:
              const: false
            requiresRegularInflow:
              const: false
      - if:
          properties:
            financingType:
              const: OVERDRAFT
          required:
          - financingType
        then:
          properties:
            overdraftRules:
              $ref: '#/components/schemas/OverdraftRules'
            revolvingLineRules:
              type: 'null'
            governmentContractRules:
              type: 'null'
            requiresSettlementAccount:
              const: true
            requiresRegularInflow:
              const: true
            minTermMonths:
              const: 12
            maxTermMonths:
              const: 12
            financialPeriodMonths:
              const: 3
      - if:
          properties:
            financingType:
              const: REVOLVING_LINE
          required:
          - financingType
        then:
          properties:
            overdraftRules:
              type: 'null'
            revolvingLineRules:
              $ref: '#/components/schemas/RevolvingLineRules'
            governmentContractRules:
              type: 'null'
            requiresSettlementAccount:
              const: false
            requiresRegularInflow:
              const: false
            minTermMonths:
              const: 24
            maxTermMonths:
              const: 24
            financialPeriodMonths:
              const: 6
      - if:
          properties:
            financingType:
              const: NON_REVOLVING_LINE
          required:
          - financingType
        then:
          properties:
            overdraftRules:
              type: 'null'
            revolvingLineRules:
              type: 'null'
            governmentContractRules:
              $ref: '#/components/schemas/GovernmentContractRules'
            requiresSettlementAccount:
              const: false
            requiresRegularInflow:
              const: false
    ProductView:
      type: object
      additionalProperties: false
      properties:
        code:
          $ref: '#/components/schemas/ProductCode'
        name:
          type: string
          minLength: 1
          maxLength: 200
          pattern: '[\s\S]*\S[\s\S]*'
        description:
          type: string
          minLength: 1
          maxLength: 3000
          pattern: '[\s\S]*\S[\s\S]*'
        terms:
          $ref: '#/components/schemas/ProductTerms'
      required:
      - code
      - name
      - description
      - terms
    ProductList:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProductView'
          maxItems: 100
      required:
      - items
    ApplicationForm:
      type: object
      additionalProperties: false
      properties:
        amount:
          anyOf:
          - $ref: '#/components/schemas/Money'
          - type: 'null'
        termMonths:
          anyOf:
          - type: integer
            minimum: 1
            maximum: 600
          - type: 'null'
        averageMonthlyInflow:
          anyOf:
          - $ref: '#/components/schemas/Money'
          - type: 'null'
        averageMonthlyOutflow:
          anyOf:
          - $ref: '#/components/schemas/Money'
          - type: 'null'
        financingPurpose:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 1000
            pattern: '[\s\S]*\S[\s\S]*'
          - type: 'null'
        projectBudget:
          anyOf:
          - $ref: '#/components/schemas/Money'
          - type: 'null'
        trancheTermMonths:
          anyOf:
          - type: integer
            minimum: 1
            maximum: 600
          - type: 'null'
        governmentContract:
          anyOf:
          - $ref: '#/components/schemas/GovernmentContractForm'
          - type: 'null'
        cashBalance:
          anyOf:
          - $ref: '#/components/schemas/Money'
          - type: 'null'
          description: Подтверждённый свободный денежный остаток до нового финансирования. Не включает сумму нового кредита, заложенные или недоступные деньги; неизвестный остаток нельзя заменять нулём.
      required:
      - amount
      - termMonths
      - averageMonthlyInflow
      - averageMonthlyOutflow
      - financingPurpose
      - projectBudget
      - trancheTermMonths
      - governmentContract
      - cashBalance
      description: 'Полная замена формы: все ключи присутствуют, null очищает поле. LONG_TERM использует financingPurpose/projectBudget, REVOLVING_LINE — trancheTermMonths, GOVERNMENT_CONTRACT_LINE — governmentContract; неприменимые поля null. amount — сумма либо лимит; termMonths — срок кредита/линии. Расчётная дата и финансовый период определяются сервером. cashBalance обязателен как ключ: null допустим в черновике, при submit требуется известная неотрицательная сумма.'
    CreateApplicationRequest:
      type: object
      additionalProperties: false
      properties:
        productCode:
          $ref: '#/components/schemas/ProductCode'
      required:
      - productCode
    SaveFormRequest:
      type: object
      additionalProperties: false
      properties:
        expectedVersion:
          $ref: '#/components/schemas/Version'
        form:
          $ref: '#/components/schemas/ApplicationForm'
      required:
      - expectedVersion
      - form
    SubmitRequest:
      type: object
      additionalProperties: false
      properties:
        expectedVersion:
          $ref: '#/components/schemas/Version'
        expectedProductTermsVersion:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '[\s\S]*\S[\s\S]*'
        clarificationResponses:
          type: array
          items:
            $ref: '#/components/schemas/ClarificationResponse'
          maxItems: 30
          uniqueItems: true
          default: []
          description: В DRAFT отсутствует или пуст. В NEEDS_INFO ответы на все текущие вопросы; уникальность clarificationId,
            принадлежность вопроса и соответствие ответа форме дополнительно проверяет Java.
      required:
      - expectedVersion
      - expectedProductTermsVersion
    ClarificationRequest:
      type: object
      additionalProperties: false
      properties:
        clarificationId:
          type: string
          format: uuid
        field:
          type: string
          const: form.averageMonthlyInflow
        code:
          type: string
          const: ZERO_INFLOW_CONFIRMATION
        message:
          type: string
          minLength: 1
          maxLength: 1000
          pattern: '[\s\S]*\S[\s\S]*'
        observedValue:
          type: string
          const: '0.00'
      required:
      - clarificationId
      - field
      - code
      - message
      - observedValue
      description: В MVP вопрос о нулевых поступлениях, сформированный Java до вызова ML. Идентификатор связан с заявкой,
        исходной попыткой, полем, значением и reportingPeriod заявки. Сохраняется до принятия ответа, включая редактирование
        запрошенного поля. observedValue не меняется вслед за form. Код нового типа уточнения требует расширения схемы
        и согласования поведения клиентов.
    ClarificationResponse:
      type: object
      additionalProperties: false
      properties:
        clarificationId:
          type: string
          format: uuid
        response:
          type: string
          enum:
          - CONFIRM_VALUE
          - VALUE_CORRECTED
        comment:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 1000
            pattern: '[\s\S]*\S[\s\S]*'
          - type: 'null'
      required:
      - clarificationId
      - response
      description: CONFIRM_VALUE подтверждает исходный ноль без изменения сохранённого поля; VALUE_CORRECTED сообщает,
        что поле уже сохранено с положительным значением. Комментарий необязателен, допускается null; не заменяет ответ,
        не меняет анкету и не передаётся в признаки ML.
    RetryRequest:
      type: object
      additionalProperties: false
      properties:
        expectedVersion:
          $ref: '#/components/schemas/Version'
      required:
      - expectedVersion
    DecisionReason:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 80
          pattern: ^[A-Z][A-Z0-9_]*$
        message:
          type: string
          minLength: 1
          maxLength: 1000
          pattern: '[\s\S]*\S[\s\S]*'
      required:
      - code
      - message
    ApprovedTerms:
      type: object
      additionalProperties: false
      properties:
        amount:
          $ref: '#/components/schemas/Money'
        currency:
          type: string
          const: RUB
        termMonths:
          type: integer
          minimum: 1
          maximum: 600
        annualRatePercent:
          type: string
          minLength: 4
          maxLength: 6
          pattern: ^(0|[1-9][0-9]{0,2})\.[0-9]{2}$
        repaymentDescription:
          type: string
          minLength: 1
          maxLength: 1000
          pattern: '[\s\S]*\S[\s\S]*'
        financingType:
          type: string
          enum:
          - TERM_LOAN
          - OVERDRAFT
          - REVOLVING_LINE
          - NON_REVOLVING_LINE
        repaymentType:
          type: string
          enum:
          - ANNUITY
          - ACCOUNT_SWEEP
          - EQUAL_PRINCIPAL_PER_TRANCHE
          - CONTRACT_PROCEEDS
        plannedEndDate:
          type: string
          format: date
          description: 'Плановая дата окончания кредита/лимита/линии: закреплённая asOfDate исходной попытки + termMonths
            календарных месяцев. Технический retry её не сдвигает. Для овердрафта это окончание лимита, не 30-дневного
            долга.'
        trancheTermMonths:
          anyOf:
          - type: integer
            minimum: 3
            maximum: 6
          - type: 'null'
        maxDebtPeriodDays:
          anyOf:
          - type: integer
            const: 30
          - type: 'null'
      required:
      - amount
      - currency
      - termMonths
      - annualRatePercent
      - repaymentDescription
      - financingType
      - repaymentType
      - plannedEndDate
      - trancheTermMonths
      - maxDebtPeriodDays
      allOf:
      - if:
          properties:
            financingType:
              const: TERM_LOAN
          required:
          - financingType
        then:
          properties:
            trancheTermMonths:
              type: 'null'
            maxDebtPeriodDays:
              type: 'null'
      - if:
          properties:
            financingType:
              const: OVERDRAFT
          required:
          - financingType
        then:
