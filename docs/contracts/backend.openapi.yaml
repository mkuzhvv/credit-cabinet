  /applications/{applicationId}/submit:
    post:
      operationId: submitApplication
      tags:
      - Processing
      summary: Отправить сохранённую заявку в фон
      security:
      - SessionCookie: []
        CsrfToken: []
      parameters:
      - $ref: '#/components/parameters/ApplicationId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitRequest'
            examples:
              initial:
                summary: Первая отправка сохранённой формы
                value:
                  expectedVersion: 1
                  expectedProductTermsVersion: demo-working-capital-2
                  clarificationResponses: []
              confirmZeroInflow:
                summary: NEEDS_INFO — подтверждение неизменного нуля без редактирования формы
                value:
                  expectedVersion: 3
                  expectedProductTermsVersion: demo-long-term-2
                  clarificationResponses:
                  - clarificationId: 1f9bd36f-e62b-47cd-a8c3-fc3227fc6893
                    response: CONFIRM_VALUE
                    comment: За указанный период поступлений от деятельности не было.
              correctZeroInflow:
                summary: NEEDS_INFO — после сохранения положительных поступлений версия стала 4
                value:
                  expectedVersion: 4
                  expectedProductTermsVersion: demo-long-term-2
                  clarificationResponses:
                  - clarificationId: 1f9bd36f-e62b-47cd-a8c3-fc3227fc6893
                    response: VALUE_CORRECTED
      description: DRAFT или NEEDS_INFO. Проверяет полноту сохранённой формы; form в теле не принимает. В DRAFT clarificationResponses
        отсутствует или пуст. В NEEDS_INFO обязательны ответы ровно на все текущие вопросы, без повторяющихся clarificationId.
        Для ZERO_INFLOW_CONFIRMATION ответ CONFIRM_VALUE допустим только при сохранённом 0.00; VALUE_CORRECTED — после
        сохранения положительного значения. Комментарий необязателен и не заменяет ответ. Отсутствующий ответ — 422 CLARIFICATION_RESPONSE_REQUIRED;
        противоречие с формой — 422 CLARIFICATION_RESPONSE_CONFLICT; ответы в DRAFT — 422 CLARIFICATION_NOT_EXPECTED;
        устаревший или посторонний идентификатор — 409 CLARIFICATION_STALE. Проверки выполняются после доступа и поиска
        успешного повтора ключа. Ответы, их связь с вопросами, снимок, новый assessmentId, CHECKING и задание сохраняются
        одной транзакцией. Подтверждение привязано к полю, исходному значению и периоду; при неизменных данных повторный
        вопрос не создаётся, в том числе при техническом retry. Изменение значения делает прежнее подтверждение неприменимым.
        Изменившиеся условия — 409 PRODUCT_TERMS_CHANGED с currentProductTermsVersion; фронт показывает их до новой отправки.
        Повтор ключа возвращает тот же assessmentId и исходное 202-подтверждение, даже если рассмотрение завершено. Для
        актуального состояния читать GET. Другой ключ при активной проверке — 409 APPLICATION_ALREADY_SUBMITTED.
      responses:
        '202':
          description: Данные и задание сохранены, рассмотрение принято.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessingAccepted'
              examples:
                initial:
                  summary: Принята первая отправка
                  value:
                    applicationId: 7be0c0bf-9019-47e0-a6b1-67548f1038f2
                    assessmentId: 8de449ef-d46c-4a0d-b108-e37d3b00bd94
                    status: CHECKING
                    version: 2
                    acceptedAt: '2026-10-22T10:02:00Z'
                    statusUrl: /api/v1/applications/7be0c0bf-9019-47e0-a6b1-67548f1038f2
                    pollAfterSeconds: 2
                confirmZeroInflow:
                  summary: Принято подтверждение; создана новая попытка
                  value:
                    applicationId: fd1a6bcf-37a6-4559-9b94-1a502eb6cce8
                    assessmentId: caf0e42a-36ca-4ed9-9ef9-5f318d86f625
                    status: CHECKING
                    version: 4
                    acceptedAt: '2026-10-22T10:03:00Z'
                    statusUrl: /api/v1/applications/fd1a6bcf-37a6-4559-9b94-1a502eb6cce8
                    pollAfterSeconds: 2
                correctZeroInflow:
                  summary: Принято исправление после сохранения формы версии 4
                  value:
                    applicationId: fd1a6bcf-37a6-4559-9b94-1a502eb6cce8
                    assessmentId: 0ea91e53-a10a-4d4b-835f-f6d3676b4576
                    status: CHECKING
                    version: 5
                    acceptedAt: '2026-10-22T10:04:00Z'
                    statusUrl: /api/v1/applications/fd1a6bcf-37a6-4559-9b94-1a502eb6cce8
                    pollAfterSeconds: 2
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'
  /applications/{applicationId}/retry:
