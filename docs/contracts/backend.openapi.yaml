      required:
      - id
      - version
      - status
      - product
      - reportingPeriod
      - form
      - assessmentId
      - lastSubmittedAt
      - decision
      - requiredInformation
      - processingError
      - allowedActions
      - createdAt
      - updatedAt
      allOf:
      - if:
          properties:
            status:
              const: DRAFT
          required:
          - status
        then:
          properties:
            allowedActions:
              const:
              - UPDATE_FORM
              - SUBMIT
            decision:
