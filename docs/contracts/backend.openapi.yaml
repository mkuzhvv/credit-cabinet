        Для продолжения нужен submit с clarificationResponses. Исходный вопрос и его clarificationId остаются доступны
        после исправления поля. Продукт неизменяем. При конфликте версии — 409 VERSION_CONFLICT, при запрещённом состоянии
        — 409 INVALID_APPLICATION_STATE. Некорректное сохранение не применяется частично. Автосохранение фронт выполняет
        последовательно; перед submit дожидается последнего успешного сохранения. Потерянный ответ PUT проверяется чтением
        заявки, не слепым повтором с новым содержимым.
      responses:
