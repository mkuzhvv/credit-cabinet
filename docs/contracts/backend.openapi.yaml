    post:
      operationId: sendAssistantMessage
      tags:
      - Assistant
      summary: Получить ответ LLM
      security:
      - SessionCookie: []
        CsrfToken: []
      parameters:
      - $ref: '#/components/parameters/ConversationId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
            example:
              text: Хочу купить печь для пекарни. Какой кредит выбрать?
              context:
                applicationId: null
                productCode: null
                fieldCode: null
      description: Обычный JSON-ответ без streaming, бюджет генерации 60 секунд. Java сама получает историю, каталог,
        определения полей и доступную заявку. Несовместимые productCode/applicationId или неизвестное поле — 422; чужая
        заявка — 404 до вызова LLM. Один активный вызов на диалог; занятый диалог/незавершённая команда — 409 CONVERSATION_BUSY
        или OPERATION_IN_PROGRESS. Пара USER+ASSISTANT сохраняется атомарно после валидного ответа; при сбое полупара
        не добавляется, фронт сохраняет введённый текст. Успешный повтор ключа не вызывает LLM и не добавляет сообщения.
        После ошибки генерации тот же ключ можно повторить; до успеха контекст собирается заново. Возврат после сбоя
        не даёт повода повторять создание заявки или менять её данные.
      responses:
        '200':
          description: Вопрос и ответ сохранены.
