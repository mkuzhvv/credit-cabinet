openapi: 3.1.1
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: Credit Cabinet — Scoring API
  version: 0.2.0
  description: Внутренний HTTP-контракт Java ↔ Python. Контракт определяет семантику признаков и шкалы риска.
    Python выполняет preprocessing и оценку риска; Java применяет итоговые правила кредитного решения.
    ML-команда подтверждает пригодность модели для согласованных признаков и продуктов. Схема признаков 2
    добавляет обязательный creditHistory, включая отдельную обработку отсутствия кредитной истории.
servers:
- url: http://scoring:8000
  description: Внутренняя Docker-сеть; порт не публикуется браузеру.
- url: http://localhost:8000
  description: Локальная разработка.
security: []
paths:
  /health/live:
    get:
      operationId: getScoringLiveness
      summary: Проверить процесс
      responses:
        '200':
          description: Процесс работает; модель может ещё загружаться.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveView'
              example:
                status: UP
  /health/ready:
    get:
      operationId: getScoringReadiness
      summary: Проверить модель и поддерживаемую схему
      responses:
        '200':
          description: Модель загружена.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyView'
              example:
                status: READY
                modelVersion: demo-risk-v2
                featureSchemaVersion: '2'
                supportedProductCodes:
                - WORKING_CAPITAL
                - EQUIPMENT
        '503':
          $ref: '#/components/responses/NotReady'
  /internal/v1/assessments:
    post:
      operationId: assessCreditRisk
      summary: Синхронно оценить сохранённые признаки
      description: Бюджет HTTP-вызова 10 секунд. Модель загружена до readiness; не загружать её на каждом
        запросе. Операция не меняет заявку и не принимает кредитное решение. Повтор assessmentId с теми же признаками
        безопасен; повтор вычисления допускается. Java проверяет совпадение assessmentId, featureSchemaVersion и ожидаемую
        modelVersion, применяет результат только к актуальной попытке и фиксирует его однократно. applicationId —
        корреляция, не право доступа к БД.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScoringRequest'
            examples:
              workingCapital:
                value:
                  assessmentId: 8de449ef-d46c-4a0d-b108-e37d3b00bd94
                  applicationId: 7be0c0bf-9019-47e0-a6b1-67548f1038f2
                  featureSchemaVersion: '2'
                  features:
                    productCode: WORKING_CAPITAL
                    currency: RUB
                    amount: '500000.00'
                    termMonths: 12
                    averageMonthlyInflow: '1200000.00'
                    averageMonthlyOutflow: '800000.00'
                    reportingPeriod:
                      startDate: '2025-10-01'
                      endDate: '2026-09-30'
                      months: 12
                    asOfDate: '2026-10-22'
                    businessAgeMonths: 86
                    equipmentPurchasePrice: null
                    creditHistory:
                      status: AVAILABLE
                      asOfDate: '2026-10-22'
                      delinquencyPeriod:
                        startDate: '2025-10-01'
                        endDate: '2026-09-30'
                        months: 12
                      totalOutstandingDebt: '350000.00'
                      monthlyDebtPayment: '20000.00'
                      overdueDebtAmount: '0.00'
                      maxDaysPastDueLast12Months: 0
              noHistory:
                value:
                  assessmentId: 774bb68c-8e90-5e8a-b9b5-f45c03f88a86
                  applicationId: 712570eb-780e-54bd-a697-be41de1526ca
                  featureSchemaVersion: '2'
                  features:
                    productCode: WORKING_CAPITAL
                    currency: RUB
                    amount: '500000.00'
                    termMonths: 12
                    averageMonthlyInflow: '1200000.00'
                    averageMonthlyOutflow: '800000.00'
                    reportingPeriod:
                      startDate: '2025-10-01'
                      endDate: '2026-09-30'
                      months: 12
                    asOfDate: '2026-10-22'
                    businessAgeMonths: 86
                    equipmentPurchasePrice: null
                    creditHistory:
                      status: NO_HISTORY
                      asOfDate: '2026-10-22'
                      delinquencyPeriod:
                        startDate: '2025-10-01'
                        endDate: '2026-09-30'
                        months: 12
                      totalOutstandingDebt: null
                      monthlyDebtPayment: null
                      overdueDebtAmount: null
                      maxDaysPastDueLast12Months: null
              overdueHistory:
                value:
                  assessmentId: 652bbcaf-d152-5aa5-a51a-f537ff62b1cb
                  applicationId: 840306f2-41ab-5476-8228-45cea8069fd0
                  featureSchemaVersion: '2'
                  features:
                    productCode: WORKING_CAPITAL
                    currency: RUB
                    amount: '500000.00'
                    termMonths: 12
                    averageMonthlyInflow: '1200000.00'
                    averageMonthlyOutflow: '800000.00'
                    reportingPeriod:
                      startDate: '2025-10-01'
                      endDate: '2026-09-30'
                      months: 12
                    asOfDate: '2026-10-22'
                    businessAgeMonths: 86
                    equipmentPurchasePrice: null
                    creditHistory:
                      status: AVAILABLE
                      asOfDate: '2026-10-22'
                      delinquencyPeriod:
                        startDate: '2025-10-01'
                        endDate: '2026-09-30'
                        months: 12
                      totalOutstandingDebt: '350000.00'
                      monthlyDebtPayment: '20000.00'
                      overdueDebtAmount: '15000.00'
                      maxDaysPastDueLast12Months: 45
              confirmedZeroInflow:
                value:
                  assessmentId: 7adc1432-b7ec-59b2-9112-89a869755e32
                  applicationId: d2fe75b3-3f0d-51cb-84e4-46ebc9787729
                  featureSchemaVersion: '2'
                  features:
                    productCode: WORKING_CAPITAL
                    currency: RUB
                    amount: '500000.00'
                    termMonths: 12
                    averageMonthlyInflow: '0.00'
                    averageMonthlyOutflow: '800000.00'
                    reportingPeriod:
                      startDate: '2025-10-01'
                      endDate: '2026-09-30'
                      months: 12
                    asOfDate: '2026-10-22'
                    businessAgeMonths: 86
                    equipmentPurchasePrice: null
                    creditHistory:
                      status: AVAILABLE
                      asOfDate: '2026-10-22'
                      delinquencyPeriod:
                        startDate: '2025-10-01'
                        endDate: '2026-09-30'
                        months: 12
                      totalOutstandingDebt: '350000.00'
                      monthlyDebtPayment: '20000.00'
                      overdueDebtAmount: '0.00'
                      maxDaysPastDueLast12Months: 0
              equipment:
                value:
                  assessmentId: 36f3f1b9-93bd-44ed-b806-564aa2c54ef7
                  applicationId: fd1a6bcf-37a6-4559-9b94-1a502eb6cce8
                  featureSchemaVersion: '2'
                  features:
                    productCode: EQUIPMENT
                    currency: RUB
                    amount: '500000.00'
                    termMonths: 12
                    averageMonthlyInflow: '1200000.00'
                    averageMonthlyOutflow: '800000.00'
                    reportingPeriod:
                      startDate: '2025-10-01'
                      endDate: '2026-09-30'
                      months: 12
                    asOfDate: '2026-10-22'
                    businessAgeMonths: 86
                    equipmentPurchasePrice: '600000.00'
                    creditHistory:
                      status: AVAILABLE
                      asOfDate: '2026-10-22'
                      delinquencyPeriod:
                        startDate: '2025-10-01'
                        endDate: '2026-09-30'
                        months: 12
                      totalOutstandingDebt: '350000.00'
                      monthlyDebtPayment: '20000.00'
                      overdueDebtAmount: '0.00'
                      maxDaysPastDueLast12Months: 0
      responses:
        '200':
          description: Оценка получена; низкий или высокий риск не меняет HTTP-статус.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScoringResponse'
              example:
                assessmentId: 8de449ef-d46c-4a0d-b108-e37d3b00bd94
                featureSchemaVersion: '2'
                modelVersion: demo-risk-v2
                riskScore: 0.18
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/InvalidFeatures'
        '500':
          $ref: '#/components/responses/InferenceFailed'
        '503':
          $ref: '#/components/responses/NotReady'
components:
  headers:
    RequestId:
      description: Идентификатор запроса для диагностики.
      schema:
        type: string
        format: uuid
    NoStore:
      description: Ответ не кэшируется.
      schema:
        type: string
        const: no-store
  schemas:
    Money:
      type: string
      minLength: 4
      maxLength: 15
      pattern: ^(0|[1-9][0-9]{0,11})\.[0-9]{2}$
      description: Неотрицательная сумма в рублях, ровно две цифры после точки. Java BigDecimal / Python Decimal.
        Это технический диапазон, не лимит продукта.
    PositiveMoney:
      type: string
      minLength: 4
      maxLength: 15
      pattern: ^(0|[1-9][0-9]{0,11})\.[0-9]{2}$
      description: Положительная сумма в RUB, ровно две цифры после точки.
      not:
        const: '0.00'
    ProductCode:
      type: string
      minLength: 2
      maxLength: 64
      pattern: ^[A-Z][A-Z0-9_]{1,63}$
      description: 'Стабильный код из каталога. MVP: WORKING_CAPITAL и EQUIPMENT; список не зашит в enum.'
    FieldCode:
      type: string
      minLength: 1
      maxLength: 120
      pattern: ^[a-z][a-zA-Z0-9]*(\.[a-z][a-zA-Z0-9]*)*$
      description: Путь поля, например form.amount или form.equipment.name.
    Version:
      type: integer
      minimum: 0
      format: int64
      maximum: 9007199254740991
      description: Версия заявки. Меняется при изменении данных или состояния; безопасна для JavaScript Number.
    ReportingPeriod:
      type: object
      additionalProperties: false
      properties:
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        months:
          type: integer
          const: 12
      required:
      - startDate
      - endDate
      - months
      description: 12 полных календарных месяцев до месяца создания черновика; границы включительно. Фиксируется сервером
        и не сдвигается при повторной отправке.
    FieldIssue:
      type: object
      additionalProperties: false
      properties:
        field:
          $ref: '#/components/schemas/FieldCode'
        code:
          type: string
          minLength: 1
          maxLength: 80
          pattern: ^[A-Z][A-Z0-9_]*$
        message:
          type: string
          minLength: 1
          maxLength: 1000
          pattern: '[\s\S]*\S[\s\S]*'
      required:
      - field
      - code
      - message
    Problem:
      type: object
      additionalProperties: true
      required:
      - type
      - title
      - status
      - code
      - requestId
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
          minLength: 1
          maxLength: 200
          pattern: '[\s\S]*\S[\s\S]*'
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
          minLength: 1
          maxLength: 2000
          pattern: '[\s\S]*\S[\s\S]*'
        instance:
          type: string
          format: uri-reference
        code:
          type: string
          minLength: 1
          maxLength: 80
          pattern: ^[A-Z][A-Z0-9_]*$
        requestId:
          type: string
          format: uuid
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldIssue'
          maxItems: 30
        currentVersion:
          $ref: '#/components/schemas/Version'
        currentProductTermsVersion:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '[\s\S]*\S[\s\S]*'
      description: RFC 9457 application/problem+json. code используется программно; message/title — для человека.
        Неизвестные расширения ответа клиент игнорирует. Стек, финансовые данные и секреты сюда не включаются.
    CreditHistoryPeriod:
      type: object
      additionalProperties: false
      properties:
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        months:
          type: integer
          const: 12
      required:
      - startDate
      - endDate
      - months
      description: 12 полных календарных месяцев перед месяцем creditHistory.asOfDate; границы включительно.
        Период не обязан совпадать с reportingPeriod анкеты. Соответствие календарных границ проверяют Java и Python.
    CreditHistory:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          enum:
          - AVAILABLE
          - NO_HISTORY
        asOfDate:
          type: string
          format: date
          description: Дата состояния обязательств в отчёте; фиксируется источником и не сдвигается при retry.
        delinquencyPeriod:
          $ref: '#/components/schemas/CreditHistoryPeriod'
        totalOutstandingDebt:
          anyOf:
          - $ref: '#/components/schemas/Money'
          - type: 'null'
          description: Остаток задолженности по кредитным обязательствам в отчёте на asOfDate, включая просроченную часть.
        monthlyDebtPayment:
          anyOf:
          - $ref: '#/components/schemas/Money'
          - type: 'null'
          description: Сумма ежемесячных платежей по действующим кредитным обязательствам в отчёте на asOfDate.
            Это не дополнительный расход к averageMonthlyOutflow; существующие обязательства уже входят в расходы.
        overdueDebtAmount:
          anyOf:
          - $ref: '#/components/schemas/Money'
          - type: 'null'
          description: Просроченная часть totalOutstandingDebt на asOfDate; не больше общей задолженности.
        maxDaysPastDueLast12Months:
          type:
          - integer
          - 'null'
          minimum: 0
          description: Максимальное число полных дней просрочки, наблюдавшееся в delinquencyPeriod.
            Длительная просрочка может начаться до этого периода. При отсутствии просрочек в полной истории — 0.
      required:
      - status
      - asOfDate
      - delinquencyPeriod
      - totalOutstandingDebt
      - monthlyDebtPayment
      - overdueDebtAmount
      - maxDaysPastDueLast12Months
      allOf:
      - if:
          properties:
            status:
              const: AVAILABLE
          required:
          - status
        then:
          properties:
            totalOutstandingDebt:
              $ref: '#/components/schemas/Money'
            monthlyDebtPayment:
              $ref: '#/components/schemas/Money'
            overdueDebtAmount:
              $ref: '#/components/schemas/Money'
            maxDaysPastDueLast12Months:
              type: integer
              minimum: 0
      - if:
          properties:
            status:
              const: NO_HISTORY
          required:
          - status
        then:
          properties:
            totalOutstandingDebt:
              type: 'null'
            monthlyDebtPayment:
              type: 'null'
            overdueDebtAmount:
              type: 'null'
            maxDaysPastDueLast12Months:
              type: 'null'
      description: Проверка успешно завершена. AVAILABLE означает наличие полных согласованных сведений за период,
        а не положительную историю. NO_HISTORY означает отсутствие записей; все четыре показателя равны null,
        статус кодируется моделью отдельно и не подменяется хорошей историей или автоматически нулевым риском.
        При недоступности, неполном или некорректном отчёте Java не вызывает скоринг. Проверку принадлежности компании,
        источника и даты получения выполняет Java; их технические метаданные не являются признаками модели.
    ScoringFeatures:
      type: object
      additionalProperties: false
      properties:
        productCode:
          $ref: '#/components/schemas/ProductCode'
        currency:
          type: string
          const: RUB
        amount:
          $ref: '#/components/schemas/PositiveMoney'
        termMonths:
          type: integer
          minimum: 1
          maximum: 600
        averageMonthlyInflow:
          $ref: '#/components/schemas/Money'
        averageMonthlyOutflow:
          $ref: '#/components/schemas/Money'
        reportingPeriod:
          $ref: '#/components/schemas/ReportingPeriod'
        asOfDate:
          type: string
          format: date
        businessAgeMonths:
          type: integer
          minimum: 0
        equipmentPurchasePrice:
          anyOf:
          - $ref: '#/components/schemas/Money'
          - type: 'null'
        creditHistory:
          $ref: '#/components/schemas/CreditHistory'
      required:
      - productCode
      - currency
      - amount
      - termMonths
      - averageMonthlyInflow
      - averageMonthlyOutflow
      - reportingPeriod
      - asOfDate
      - businessAgeMonths
      - equipmentPurchasePrice
      - creditHistory
      allOf:
      - if:
          properties:
            productCode:
              const: EQUIPMENT
          required:
          - productCode
        then:
          properties:
            equipmentPurchasePrice:
              $ref: '#/components/schemas/PositiveMoney'
      - if:
          properties:
            productCode:
              const: WORKING_CAPITAL
          required:
          - productCode
        then:
          properties:
            equipmentPurchasePrice:
              type: 'null'
      description: Признаки из сохранённых снимков попытки. Деньги в RUB; все ключи обязательны. Для EQUIPMENT purchasePrice
        положителен; amount положителен для обоих продуктов. Python не запрашивает данные у фронта и не читает БД
        Java. Кредитный профиль получен сервером и сохранён в credit_history_snapshot; остальные признаки — в
        input_snapshot. Python обрабатывает AVAILABLE и NO_HISTORY явно; UNAVAILABLE в признаки не передаётся.
        Кодирование и преобразования под конкретную модель выполняются внутри Python.
    ScoringRequest:
      type: object
      additionalProperties: false
      properties:
        assessmentId:
          type: string
          format: uuid
        applicationId:
          type: string
          format: uuid
        featureSchemaVersion:
          type: string
          const: '2'
        features:
          $ref: '#/components/schemas/ScoringFeatures'
      required:
      - assessmentId
      - applicationId
      - featureSchemaVersion
      - features
    ScoringResponse:
      type: object
      additionalProperties: false
      properties:
        assessmentId:
          type: string
          format: uuid
        featureSchemaVersion:
          type: string
          const: '2'
        modelVersion:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '[\s\S]*\S[\s\S]*'
        riskScore:
          type: number
          minimum: 0
          maximum: 1
          description: Чем больше, тем выше риск. Конечное число [0,1]; NaN/Infinity запрещены JSON. Не объявляется
            калиброванной PD без отдельного обоснования.
      required:
      - assessmentId
      - featureSchemaVersion
      - modelVersion
      - riskScore
    ReadyView:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          const: READY
        modelVersion:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '[\s\S]*\S[\s\S]*'
        featureSchemaVersion:
          type: string
          const: '2'
        supportedProductCodes:
          type: array
          items:
            $ref: '#/components/schemas/ProductCode'
          minItems: 1
          uniqueItems: true
          maxItems: 100
      required:
      - status
      - modelVersion
      - featureSchemaVersion
      - supportedProductCodes
    LiveView:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          const: UP
      required:
      - status
  responses:
    BadRequest:
      description: Неверный JSON
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:credit-cabinet:problem:malformed-request
            title: Неверный JSON
            status: 400
            code: MALFORMED_REQUEST
            requestId: 291536c3-43fc-4419-a671-44e4cd902f3e
    InvalidFeatures:
      description: Признаки не соответствуют контракту
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:credit-cabinet:problem:invalid-features
            title: Признаки не соответствуют контракту
            status: 422
            code: INVALID_FEATURES
            requestId: 291536c3-43fc-4419-a671-44e4cd902f3e
            errors:
            - field: features.amount
              code: POSITIVE_REQUIRED
              message: Сумма должна быть положительной
    NotReady:
      description: Модель ещё не готова
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:credit-cabinet:problem:model-not-ready
            title: Модель ещё не готова
            status: 503
            code: MODEL_NOT_READY
            requestId: 291536c3-43fc-4419-a671-44e4cd902f3e
    InferenceFailed:
      description: Не удалось получить оценку
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:credit-cabinet:problem:inference-failed
            title: Не удалось получить оценку
            status: 500
            code: INFERENCE_FAILED
            requestId: 291536c3-43fc-4419-a671-44e4cd902f3e
x-timeout-seconds: 10
