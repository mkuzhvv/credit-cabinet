openapi: 3.1.1
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: Credit Cabinet — Scoring API
  version: 0.3.0
  description: Внутренний Java ↔ Python HTTP-контракт. Схема признаков 3 поддерживает пять продуктов, период 3/6/12 месяцев
    и продуктовые признаки. Java применяет обязательные правила, включая отсутствие текущей просрочки, до ML. Python
    выполняет preprocessing и оценку риска; не принимает кредитное решение. Реальный артефакт и порог подтверждает ML-команда.
servers:
- url: http://scoring:8000
  description: Внутренняя Docker-сеть; порт не публикуется браузеру.
- url: http://localhost:8000
  description: Локальная разработка.
security: []
paths:
  /health/live:
    get:
      operationId: getScoringLiveness
      summary: Проверить процесс
      responses:
        '200':
          description: Процесс работает; модель может ещё загружаться.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveView'
              example:
                status: UP
  /health/ready:
    get:
      operationId: getScoringReadiness
      summary: Проверить модель и поддерживаемую схему
      responses:
        '200':
          description: Модель загружена.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyView'
              example:
                status: READY
                modelVersion: demo-risk-v3
                featureSchemaVersion: '3'
                supportedProductCodes:
                - WORKING_CAPITAL
                - OVERDRAFT
                - REVOLVING_LINE
                - LONG_TERM
                - GOVERNMENT_CONTRACT_LINE
        '503':
          $ref: '#/components/responses/NotReady'
  /internal/v1/assessments:
    post:
      operationId: assessCreditRisk
      summary: Синхронно оценить сохранённые признаки
      description: Бюджет HTTP-вызова 10 секунд. Модель загружена до readiness; не загружать её на каждом запросе. Операция
        не меняет заявку и не принимает кредитное решение. Повтор assessmentId с теми же признаками безопасен; повтор
        вычисления допускается. Java проверяет совпадение assessmentId, featureSchemaVersion и ожидаемую modelVersion,
        применяет результат только к актуальной попытке и фиксирует его однократно. applicationId — корреляция, не право
        доступа к БД.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScoringRequest'
            examples:
              working_capital:
                value:
                  assessmentId: 8de449ef-d46c-4a0d-b108-e37d3b00bd94
                  applicationId: 7be0c0bf-9019-47e0-a6b1-67548f1038f2
                  featureSchemaVersion: '3'
