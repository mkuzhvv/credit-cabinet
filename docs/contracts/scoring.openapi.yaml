components:
  headers:
    RequestId:
      description: Идентификатор запроса для диагностики.
      schema:
        type: string
        format: uuid
    NoStore:
      description: Ответ не кэшируется.
      schema:
        type: string
        const: no-store
  schemas:
    Money:
      type: string
      minLength: 4
      maxLength: 15
      pattern: ^(0|[1-9][0-9]{0,11})\.[0-9]{2}$
      description: Неотрицательная сумма в рублях, ровно две цифры после точки. Java BigDecimal / Python Decimal. Это
        технический диапазон, не лимит продукта.
    PositiveMoney:
      type: string
      minLength: 4
      maxLength: 15
      pattern: ^(0|[1-9][0-9]{0,11})\.[0-9]{2}$
      description: Положительная сумма в RUB, ровно две цифры после точки.
      not:
        const: '0.00'
    ProductCode:
      type: string
      minLength: 2
      maxLength: 64
      pattern: ^[A-Z][A-Z0-9_]{1,63}$
      description: 'Стабильный код из каталога. MVP: WORKING_CAPITAL, OVERDRAFT, REVOLVING_LINE, LONG_TERM, GOVERNMENT_CONTRACT_LINE.
        Список не зашит в enum; новый код требует явной поддержки формы, политики и ML.'
    FieldCode:
      type: string
      minLength: 1
      maxLength: 120
      pattern: ^[a-z][a-zA-Z0-9]*(\.[a-z][a-zA-Z0-9]*)*$
      description: Путь поля, например form.amount или form.financingPurpose.
    Version:
      type: integer
      minimum: 0
      format: int64
      maximum: 9007199254740991
      description: Версия заявки. Меняется при изменении данных или состояния; безопасна для JavaScript Number.
    ReportingPeriod:
      type: object
      additionalProperties: false
      properties:
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        months:
          type: integer
          enum:
          - 3
          - 6
          - 12
      required:
      - startDate
      - endDate
      - months
      description: 'Полные календарные месяцы до месяца calculationDate черновика; границы включительно. Число месяцев
        определяет продукт: OVERDRAFT=3, WORKING_CAPITAL/REVOLVING_LINE=6, LONG_TERM/GOVERNMENT_CONTRACT_LINE=12. Период
        фиксируется сервером и не сдвигается при submit/retry.'
    FieldIssue:
      type: object
      additionalProperties: false
      properties:
        field:
          $ref: '#/components/schemas/FieldCode'
        code:
          type: string
          minLength: 1
          maxLength: 80
          pattern: ^[A-Z][A-Z0-9_]*$
        message:
          type: string
          minLength: 1
          maxLength: 1000
          pattern: '[\s\S]*\S[\s\S]*'
      required:
      - field
      - code
      - message
    Problem:
      type: object
      additionalProperties: true
      required:
      - type
      - title
      - status
      - code
      - requestId
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
          minLength: 1
          maxLength: 200
          pattern: '[\s\S]*\S[\s\S]*'
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
          minLength: 1
          maxLength: 2000
          pattern: '[\s\S]*\S[\s\S]*'
        instance:
          type: string
          format: uri-reference
        code:
          type: string
          minLength: 1
          maxLength: 80
          pattern: ^[A-Z][A-Z0-9_]*$
        requestId:
          type: string
          format: uuid
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldIssue'
          maxItems: 30
        currentVersion:
          $ref: '#/components/schemas/Version'
        currentProductTermsVersion:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '[\s\S]*\S[\s\S]*'
      description: RFC 9457 application/problem+json. code используется программно; message/title — для человека. Неизвестные
        расширения ответа клиент игнорирует. Стек, финансовые данные и секреты сюда не включаются.
    CreditHistoryPeriod:
      type: object
      additionalProperties: false
      properties:
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        months:
          type: integer
          const: 12
      required:
      - startDate
      - endDate
      - months
      description: 12 полных календарных месяцев перед месяцем creditHistory.asOfDate; границы включительно. Период не
        обязан совпадать с reportingPeriod анкеты. Соответствие календарных границ проверяют Java и Python.
    CreditHistory:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          enum:
          - AVAILABLE
          - NO_HISTORY
        asOfDate:
          type: string
          format: date
          description: Дата состояния обязательств в отчёте; фиксируется источником и не сдвигается при retry.
        delinquencyPeriod:
          $ref: '#/components/schemas/CreditHistoryPeriod'
        totalOutstandingDebt:
          anyOf:
          - $ref: '#/components/schemas/Money'
          - type: 'null'
          description: Остаток задолженности по кредитным обязательствам в отчёте на asOfDate, включая просроченную часть.
        monthlyDebtPayment:
          anyOf:
          - $ref: '#/components/schemas/Money'
          - type: 'null'
          description: Сумма ежемесячных платежей по действующим кредитным обязательствам в отчёте на asOfDate. Это не
            дополнительный расход к averageMonthlyOutflow; существующие обязательства уже входят в расходы.
        overdueDebtAmount:
          anyOf:
          - $ref: '#/components/schemas/Money'
          - type: 'null'
          description: Просроченная часть totalOutstandingDebt на asOfDate; не больше общей задолженности.
        maxDaysPastDueLast12Months:
          type:
          - integer
          - 'null'
          minimum: 0
          description: Максимальное число полных дней просрочки, наблюдавшееся в delinquencyPeriod. Длительная просрочка
            может начаться до этого периода. При отсутствии просрочек в полной истории — 0.
      required:
      - status
      - asOfDate
      - delinquencyPeriod
      - totalOutstandingDebt
      - monthlyDebtPayment
      - overdueDebtAmount
      - maxDaysPastDueLast12Months
      allOf:
      - if:
          properties:
            status:
              const: AVAILABLE
          required:
          - status
        then:
          properties:
            totalOutstandingDebt:
              $ref: '#/components/schemas/Money'
            monthlyDebtPayment:
              $ref: '#/components/schemas/Money'
            overdueDebtAmount:
              $ref: '#/components/schemas/Money'
            maxDaysPastDueLast12Months:
              type: integer
              minimum: 0
      - if:
          properties:
            status:
              const: NO_HISTORY
          required:
          - status
        then:
          properties:
            totalOutstandingDebt:
              type: 'null'
            monthlyDebtPayment:
              type: 'null'
            overdueDebtAmount:
              type: 'null'
            maxDaysPastDueLast12Months:
              type: 'null'
      description: Проверка успешно завершена. AVAILABLE означает наличие полных согласованных сведений за период, а
        не положительную историю. NO_HISTORY означает отсутствие записей; все четыре показателя равны null, статус кодируется
        моделью отдельно и не подменяется хорошей историей или автоматически нулевым риском. При недоступности, неполном
        или некорректном отчёте Java не вызывает скоринг. Проверку принадлежности компании, источника и даты получения
        выполняет Java; их технические метаданные не являются признаками модели.
    ScoringFeatures:
      type: object
      additionalProperties: false
      properties:
        productCode:
          $ref: '#/components/schemas/ProductCode'
        currency:
          type: string
          const: RUB
        amount:
          $ref: '#/components/schemas/PositiveMoney'
        termMonths:
          type: integer
          minimum: 1
          maximum: 600
        averageMonthlyInflow:
          $ref: '#/components/schemas/Money'
        averageMonthlyOutflow:
          $ref: '#/components/schemas/Money'
        reportingPeriod:
          $ref: '#/components/schemas/ReportingPeriod'
        asOfDate:
          type: string
          format: date
          description: UTC-дата принятия исходной попытки submit, по ней рассчитывают возраст бизнеса и plannedEndDate.
            При техническом retry сохраняется. Не обязана совпадать с calculationDate черновика или датой кредитного
            отчёта; reportingPeriod закреплён при создании черновика отдельно.
        businessAgeMonths:
          type: integer
          minimum: 0
        creditHistory:
          $ref: '#/components/schemas/CreditHistory'
        projectBudget:
          anyOf:
          - $ref: '#/components/schemas/PositiveMoney'
          - type: 'null'
        trancheTermMonths:
          anyOf:
          - type: integer
            minimum: 3
            maximum: 6
          - type: 'null'
        governmentContract:
          anyOf:
          - $ref: '#/components/schemas/GovernmentContractFeatures'
          - type: 'null'
      required:
      - productCode
      - currency
      - amount
      - termMonths
      - averageMonthlyInflow
      - averageMonthlyOutflow
      - reportingPeriod
      - asOfDate
      - businessAgeMonths
      - creditHistory
      - projectBudget
      - trancheTermMonths
      - governmentContract
      allOf:
      - if:
          properties:
            productCode:
              const: WORKING_CAPITAL
          required:
          - productCode
        then:
          properties:
            reportingPeriod:
              properties:
                months:
                  const: 6
            projectBudget:
              type: 'null'
            trancheTermMonths:
              type: 'null'
            governmentContract:
              type: 'null'
            termMonths:
              type: integer
              minimum: 3
              maximum: 12
      - if:
          properties:
            productCode:
              const: OVERDRAFT
          required:
          - productCode
        then:
          properties:
            reportingPeriod:
              properties:
                months:
                  const: 3
            projectBudget:
              type: 'null'
            trancheTermMonths:
              type: 'null'
            governmentContract:
              type: 'null'
            termMonths:
              type: integer
              minimum: 12
              maximum: 12
      - if:
          properties:
            productCode:
              const: REVOLVING_LINE
          required:
          - productCode
        then:
          properties:
            reportingPeriod:
              properties:
                months:
                  const: 6
            projectBudget:
              type: 'null'
            trancheTermMonths:
              type: integer
              minimum: 3
              maximum: 6
            governmentContract:
              type: 'null'
            termMonths:
              type: integer
              minimum: 24
              maximum: 24
      - if:
          properties:
            productCode:
              const: LONG_TERM
          required:
          - productCode
        then:
          properties:
            reportingPeriod:
              properties:
                months:
                  const: 12
            projectBudget:
              $ref: '#/components/schemas/PositiveMoney'
            trancheTermMonths:
              type: 'null'
            governmentContract:
              type: 'null'
            termMonths:
              type: integer
              minimum: 24
              maximum: 60
      - if:
          properties:
            productCode:
              const: GOVERNMENT_CONTRACT_LINE
          required:
          - productCode
        then:
          properties:
            reportingPeriod:
              properties:
                months:
                  const: 12
            projectBudget:
              type: 'null'
            trancheTermMonths:
              type: 'null'
            governmentContract:
              $ref: '#/components/schemas/GovernmentContractFeatures'
            termMonths:
              type: integer
              minimum: 1
              maximum: 12
      - properties:
          creditHistory:
            if:
              properties:
                status:
                  const: AVAILABLE
              required:
              - status
            then:
              properties:
                overdueDebtAmount:
                  const: '0.00'
      description: Схема признаков 3 для пяти продуктов. Исходные данные из input_snapshot, профиль из credit_history_snapshot.profile.
        Текущая просрочка отсеивается Java до ML; NO_HISTORY кодируется отдельно. Период 3/6/12 месяцев зависит от продукта.
        projectBudget только LONG_TERM, trancheTermMonths только REVOLVING_LINE, governmentContract только GOVERNMENT_CONTRACT_LINE.
        Неприменимые значения null. Python делает preprocessing и оценку риска, а не кредитное решение.
    ScoringRequest:
      type: object
      additionalProperties: false
      properties:
        assessmentId:
          type: string
          format: uuid
        applicationId:
          type: string
          format: uuid
        featureSchemaVersion:
          type: string
          const: '3'
        features:
          $ref: '#/components/schemas/ScoringFeatures'
      required:
      - assessmentId
      - applicationId
      - featureSchemaVersion
      - features
    ScoringResponse:
      type: object
      additionalProperties: false
      properties:
        assessmentId:
          type: string
          format: uuid
        featureSchemaVersion:
          type: string
          const: '3'
        modelVersion:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '[\s\S]*\S[\s\S]*'
        riskScore:
          type: number
          minimum: 0
          maximum: 1
          description: Чем больше, тем выше риск. Конечное число [0,1]; NaN/Infinity запрещены JSON. Не объявляется калиброванной
            PD без отдельного обоснования.
      required:
      - assessmentId
      - featureSchemaVersion
      - modelVersion
      - riskScore
    ReadyView:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          const: READY
        modelVersion:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '[\s\S]*\S[\s\S]*'
        featureSchemaVersion:
          type: string
          const: '3'
        supportedProductCodes:
          type: array
          items:
            $ref: '#/components/schemas/ProductCode'
          minItems: 1
          uniqueItems: true
          maxItems: 100
      required:
      - status
      - modelVersion
      - featureSchemaVersion
      - supportedProductCodes
    LiveView:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          const: UP
      required:
      - status
    GovernmentContractFeatures:
      type: object
      additionalProperties: false
      properties:
        contractAmount:
          $ref: '#/components/schemas/PositiveMoney'
        advanceAmount:
          $ref: '#/components/schemas/Money'
        executionEndDate:
          type: string
          format: date
        finalPaymentDate:
          type: string
          format: date
        plannedEndDate:
          type: string
          format: date
      required:
      - contractAmount
      - advanceAmount
      - executionEndDate
      - finalPaymentDate
      - plannedEndDate
      description: Нормализованные данные контракта; plannedEndDate = asOfDate исходной попытки + termMonths. Номер и
        текст в ML не передаются. Java проверяет аванс, 70% чистой суммы и календарные сроки; Python перепроверяет семантику
        признаков.
  responses:
    BadRequest:
      description: Неверный JSON
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:credit-cabinet:problem:malformed-request
            title: Неверный JSON
            status: 400
            code: MALFORMED_REQUEST
            requestId: 291536c3-43fc-4419-a671-44e4cd902f3e
    InvalidFeatures:
      description: Признаки не соответствуют контракту
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:credit-cabinet:problem:invalid-features
            title: Признаки не соответствуют контракту
            status: 422
            code: INVALID_FEATURES
            requestId: 291536c3-43fc-4419-a671-44e4cd902f3e
            errors:
            - field: features.amount
              code: POSITIVE_REQUIRED
              message: Сумма должна быть положительной
    NotReady:
      description: Модель ещё не готова
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:credit-cabinet:problem:model-not-ready
            title: Модель ещё не готова
            status: 503
            code: MODEL_NOT_READY
            requestId: 291536c3-43fc-4419-a671-44e4cd902f3e
    InferenceFailed:
      description: Не удалось получить оценку
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:credit-cabinet:problem:inference-failed
            title: Не удалось получить оценку
            status: 500
            code: INFERENCE_FAILED
            requestId: 291536c3-43fc-4419-a671-44e4cd902f3e
x-timeout-seconds: 10
