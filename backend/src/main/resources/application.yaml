spring:
  application:
    name: credit-cabinet-backend
  profiles:
    default: demo
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  jackson:
    time-zone: UTC
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/credit_cabinet}
    username: ${DB_USERNAME:credit_cabinet}
    password: ${DB_PASSWORD:}
  flyway:
    enabled: true
    clean-disabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

server:
  servlet:
    session:
      cookie:
        http-only: true
        path: /
        same-site: lax

logging:
  pattern:
    level: "%5p [requestId=%X{requestId:-}]"
