spring:
  application:
    name: credit-cabinet-backend
  profiles:
    default: demo
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  jackson:
    time-zone: UTC
  ai:
    model:
      chat: none
      embedding: none
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/credit_cabinet}
    username: ${DB_USERNAME:credit_cabinet}
    password: ${DB_PASSWORD:}
  flyway:
    enabled: true
    clean-disabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

credit:
  processing:
    enabled: true
    poll-delay: 1s
    lease-duration: 30s
    credit-history-timeout: 5s
    retry-delay: 1s
    max-executions: 3

assistant:
  timeout: 60s
  lease-duration: 75s
  ollama:
    base-url: http://localhost:11434
    connect-timeout: 2s

scoring:
  base-url: http://localhost:8000
  connect-timeout: 2s
  timeout: 10s
  expected-model-version: rules-cashflow-v1-59fdb57552ca

demo:
  credit-history:
    scenario: DEFAULT

server:
  servlet:
    session:
      cookie:
        http-only: true
        path: /
        same-site: lax

logging:
  pattern:
    level: "%5p [requestId=%X{requestId:-}]"
