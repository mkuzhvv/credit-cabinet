name: credit-cabinet-dev

services:
  postgres:
    
    image: postgres:18.6-alpine
    container_name: credit-cabinet-db

    environment:
      POSTGRES_DB: credit_cabinet
      POSTGRES_USER: credit_cabinet
      POSTGRES_HOST_AUTH_METHOD: trust
      TZ: UTC

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    stop_grace_period: 30s

volumes:
  postgres-data:
    name: credit-cabinet-db-data
